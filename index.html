<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVAI</title>

  <style>
    @font-face {
      font-family: "Synonym";
      src: url("fonts/Synonym-Regular.otf") format("opentype");
    }

    @font-face {
      font-family: "Alpino";
      src: url("fonts/Alpino-Medium.otf") format("opentype");
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #cfe0f8 0%, #e3ecfb 100%);
      font-family: "Synonym", sans-serif;
      color: #0a1a2f;
      text-align: center;
    }

    .wrap {
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
    }

    .logo {
      width: clamp(360px, 50vw, 600px);
      margin-bottom: 50px;
    }

    h1 {
      font-family: "Alpino", serif;
      font-size: clamp(24px, 2.5vw, 34px);
      font-weight: 500;
      margin-bottom: 18px;
      color: #08182d;
    }

    .sub {
      font-size: 15px;
      letter-spacing: 0.03em;
      opacity: 0.75;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <img src="evai.svg" class="logo" alt="EVAI Logo" />

    <h1>Understanding Variance. Prioritizing Risk.</h1>

    <div class="sub">
      AI-powered analytics for operational intelligence and decision support.
    </div>

  </div>
</body>
</html>
